name: Node.js CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        timeout-minutes: 30
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
      - name: Wait for 30 seconds
        run: sleep 30
      
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      timeout-minutes: 30
      uses: actions/checkout@v4
    - name: Wait for 30 seconds
      run: sleep 30
